name: Deploy Delta Nusantara Persada

on:
  push:
    branches:
      - main
    paths:
      - 'delta-nusantara-persada/**'
      - '.github/workflows/deploy-dnp.yml'

jobs:
  test-and-verify:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: delta-nusantara-persada/frontend
        run: npm install --no-audit

      - name: Execute Tests
        working-directory: delta-nusantara-persada/frontend
        run: npm test

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && secrets.VPS_HOST != '' }}
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [1/3] Pulling latest updates from GitHub..."
            cd /var/www/delta-nusantara/deltagroup
            git pull origin main

            echo "📦 [2/3] Optimizing Laravel 11 Backend..."
            cd delta-nusantara-persada/backend
            composer install --no-dev --optimize-autoloader --quiet
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "⚡ [3/3] Building Next.js 14 Standalone Frontend..."
            cd ../frontend
            npm ci --silent
            npm run build
            cp -r public .next/standalone/delta-nusantara-persada/frontend/
            cp -r .next/static .next/standalone/delta-nusantara-persada/frontend/.next/
            pm2 reload ecosystem.config.js
            rm -rf .next/cache

            echo "✅ Deployment Successful!"
